name: Deploy Hugo site to Pages

on:
  push:
    branches: [master]
  # Rebuild on January 1 (08:05 UTC, just after midnight Pacific) so the footer's copyright year, which is set at
  # build time, rolls over even without a push.
  schedule:
    - cron: "5 8 1 1 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Install Hugo
        run: |
          curl -sSL -o "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      # Sign the scripts posts tell readers to download, so they can check a file came from this repo's build with
      # `gh attestation verify <file> --repo awalsh128/awalsh128.github.io`, independent of the site serving it.
      - name: Attest downloadable scripts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            public/**/*.sh
            public/**/safe-fetch-exec
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
