# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark"

# Site
locale: "en-US"
title: "Andrew Walsh's Website"
title_separator: "-"
description: "Thoughts on Software Engineering."
url: "https://awalsh128.com"
baseurl: "/"
repository: "awalsh128/awalsh128.github.io"
words_per_minute: 200

# Comments
comments:
  provider: "disqus"
  disqus:
    shortname: "andrew-walshs-website"

# Search
search: true
search_provider: google
google:
  search_engine_id: fa7d73f872f974392
  instant_search: true

# Author
author:
  name: "Andrew Walsh"
  avatar: "/assets/img/avatar_lowres.png"
  bio: "Coder with a passion for most all things technological."
  location: "US"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/awalsh128"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/andrew-walsh-a235787/"
    - label: "Resume"
      icon: "fas fa-fw fa-file-alt"
      url: "https://lykotek.com/assets/resume.html"
    - label: "Support Open Source"
      icon: "fab fa-heart"
      url: "https://github.com/sponsors/awalsh128"

# Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/awalsh128"
    - label: "Linkedin"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/andrew-walsh-a235787/"
    - label: "Resume"
      icon: "fas fa-fw fa-file-alt"
      url: "https://lykotek.com/assets/resume.html"
    - label: "Support Open Source"
      icon: "fab fa-heart"
      url: "https://github.com/sponsors/awalsh128"

# Files
include:
  - .htaccess
exclude:
  - node_modules
  - vendor
  - Gemfile
  - package.json
  - log
  - tmp
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Output
permalink: /:categories/:title/
timezone: US/Pacific

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Collections
collections:
  notes:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      comments: true
      toc: true
      toc_icon: "columns"
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: notes
    values:
      author_profile: true
      layout: single
      comments: true
      share: true

github: [metadata]