<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">An incident working its way down</title>
  <desc id="desc">Latency percentiles over 60 minutes. p99 crosses the 500 ms SLO first, around minute 10, followed by p95 around minute 21, p90 around minute 32, and finally p50 around minute 45. Each crossing is marked: p99 watch, p95 investigate, p90 escalate, p50 it has happened.</desc>

  <style>
    .bg { fill: #fcfcfb; }
    .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #8a8f98; }
    .grid { stroke: #e6e5e1; stroke-width: 1; }
    .axis { stroke: #b9b8b2; stroke-width: 1; }
    .slo { stroke: #e34948; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .slo-t { fill: #c23a39; }
    .mark { stroke: #8a8f98; stroke-width: 1; stroke-dasharray: 2 3; }
    .band { fill: #eda100; opacity: 0.08; }
    .s1 { stroke: #2a78d6; } .s2 { stroke: #eb6834; } .s3 { stroke: #1baf7a; } .s4 { stroke: #eda100; }
    .f1 { fill: #2a78d6; } .f2 { fill: #eb6834; } .f3 { fill: #1baf7a; } .f4 { fill: #eda100; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .dot { stroke: #fcfcfb; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1a19; }
      .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #8f8e88; }
      .grid { stroke: #2c2c2a; } .axis { stroke: #4a4a47; }
      .slo { stroke: #e66767; } .slo-t { fill: #e66767; }
      .band { fill: #c98500; opacity: 0.12; }
      .s1 { stroke: #3987e5; } .s2 { stroke: #d95926; } .s3 { stroke: #199e70; } .s4 { stroke: #c98500; }
      .f1 { fill: #3987e5; } .f2 { fill: #d95926; } .f3 { fill: #199e70; } .f4 { fill: #c98500; }
      .dot { stroke: #1a1a19; }
    }
  </style>
  <rect class="bg" width="760" height="400" rx="10"/>
  <text class="t1" x="64" y="26" font-size="16" font-weight="600">An incident working its way down</text>
  <text class="t2" x="64" y="44" font-size="12">Each percentile crosses the SLO in turn, from the tail to the median.</text>
  <line class="axis" x1="64" y1="344.0" x2="640" y2="344.0"/>
  <text class="t3" x="56" y="348.0" font-size="11" text-anchor="end">0</text>
  <line class="grid" x1="64" y1="278.0" x2="640" y2="278.0"/>
  <text class="t3" x="56" y="282.0" font-size="11" text-anchor="end">500</text>
  <line class="grid" x1="64" y1="212.0" x2="640" y2="212.0"/>
  <text class="t3" x="56" y="216.0" font-size="11" text-anchor="end">1000</text>
  <line class="grid" x1="64" y1="146.0" x2="640" y2="146.0"/>
  <text class="t3" x="56" y="150.0" font-size="11" text-anchor="end">1500</text>
  <line class="grid" x1="64" y1="80.0" x2="640" y2="80.0"/>
  <text class="t3" x="56" y="84.0" font-size="11" text-anchor="end">2000</text>
