<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">A tail blip</title>
  <desc id="desc">Latency percentiles over 60 minutes. p99 spikes from about 340 ms to just over 700 ms around minute 27 and recovers by minute 35. p95 barely moves and p90 and p50 stay flat, all well under the 500 ms SLO.</desc>

